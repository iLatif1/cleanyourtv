name: Build launcher APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.apk.outputs.tag }}
      name: ${{ steps.apk.outputs.name }}
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Decode the release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build release APK
        working-directory: launcher
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -q --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
      - name: APK facts
        id: apk
        working-directory: launcher
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          version=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          tag="v${version}-${RUN_NUMBER}"
          name="cleanyourtv-${tag}.apk"
          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/$name"
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          {
            git log -1 --format=%B
            echo
            echo "SHA-256: $SHA256"
          } > "$RUNNER_TEMP/release/notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ needs.build.outputs.tag }}
          APK_NAME: ${{ needs.build.outputs.name }}
        run: |
          # Only islamic-home's releases should appear as "Latest" on the repo's releases page.
          latest_flag=--latest=false
          if [ "$REF_NAME" = "islamic-home" ]; then
            latest_flag=--latest
          fi
          gh release create "$TAG" \
            "release/$APK_NAME" \
            --repo "$REPO" \
            --target "$REF_NAME" \
            --title "$TAG" \
            --notes-file release/notes.md \
            "$latest_flag"
